[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forage"
version = "0.1.0"
description = "Zero-dependency Chinese-aware retrieval over your own tech-blog corpus (FTS5 + query rewriting + weighted RRF)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["retrieval", "rag", "fts5", "bm25", "chinese", "sqlite", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Database",
]

# ★ 零运行时依赖 —— 全部走 Python 标准库（sqlite3 / urllib / html.parser / xml）
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
forage = "forage.cli:main"

[tool.setuptools]
packages = ["forage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
